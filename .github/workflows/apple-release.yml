name: Apple release builds

# Manual run: builds a signed iOS .ipa and a signed Mac App Store .pkg and (optionally) uploads both
# to App Store Connect / TestFlight. Required repository secrets:
#   IOS_CERTIFICATE_P12          base64 of an "Apple Distribution" certificate (.p12); also signs the Mac app
#   IOS_CERTIFICATE_PASSWORD     password of that .p12
#   MAC_INSTALLER_P12            base64 of a "Mac Installer Distribution" certificate (.p12)
#   MAC_INSTALLER_PASSWORD       password of that .p12
#   IOS_PROVISIONING_PROFILE     base64 of the iOS App Store provisioning profile (.mobileprovision)
#   MAC_PROVISIONING_PROFILE     base64 of the Mac Catalyst App Store provisioning profile (.provisionprofile)
#   APPSTORE_API_KEY_ID / APPSTORE_API_ISSUER_ID / APPSTORE_API_PRIVATE_KEY   App Store Connect API key
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (CFBundleVersion), must increase every upload"
        required: true
        type: string
      upload:
        description: "Upload to App Store Connect"
        type: boolean
        default: true

env:
  PROJECT: "Path of Boredom.Maui/Path of Boredom.Maui.csproj"

jobs:
  apple:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # The .NET iOS workload pins a minimum Xcode; use the newest one on the runner.
          # Skip partially installed Xcodes (missing iPhoneOS/MacOSX SDKs break actool).
          XCODE=""
          for x in $(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V -r); do
            D="$x/Contents/Developer"
            if DEVELOPER_DIR="$D" xcrun --sdk macosx --show-sdk-path >/dev/null 2>&1 \
              && DEVELOPER_DIR="$D" xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1 \
              && DEVELOPER_DIR="$D" xcrun --sdk macosx -find actool >/dev/null 2>&1; then
              XCODE="$x"; break
            fi
            echo "Skipping $x (SDKs/actool unusable)"
          done
          [ -n "$XCODE" ] || { echo "No complete Xcode found"; exit 1; }
          XCODE=$(cd "$XCODE" && pwd -P)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          # Make the .NET iOS SDK use the same Xcode instead of its own lookup.
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          echo "MD_APPLE_SDK_ROOT=$XCODE" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI workloads
        run: dotnet workload install maui-ios maui-maccatalyst maui-android

      - name: Import certificates and profiles
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          MAC_INSTALLER_P12: ${{ secrets.MAC_INSTALLER_P12 }}
          MAC_INSTALLER_PASSWORD: ${{ secrets.MAC_INSTALLER_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          MAC_PROVISIONING_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/dist.p12
          security import $RUNNER_TEMP/dist.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          if [ -n "$MAC_INSTALLER_P12" ]; then
            echo "$MAC_INSTALLER_P12" | base64 --decode > $RUNNER_TEMP/installer.p12
            security import $RUNNER_TEMP/installer.p12 -P "$MAC_INSTALLER_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          install_profile() {
            local file=$1 ext=$2 uuid
            uuid=$(security cms -D -i "$file" | plutil -extract UUID raw -)
            for dir in ~/Library/MobileDevice/Provisioning\ Profiles ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles; do
              mkdir -p "$dir"; cp "$file" "$dir/$uuid.$ext"
            done
          }
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > $RUNNER_TEMP/ios.mobileprovision
          install_profile $RUNNER_TEMP/ios.mobileprovision mobileprovision
          if [ -n "$MAC_PROVISIONING_PROFILE" ]; then
            echo "$MAC_PROVISIONING_PROFILE" | base64 --decode > $RUNNER_TEMP/mac.provisionprofile
            install_profile $RUNNER_TEMP/mac.provisionprofile provisionprofile
          fi
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build iOS (.ipa)
        run: |
          set -o pipefail
          dotnet publish "$PROJECT" -f net9.0-ios -c Release -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true -p:ApplicationVersion=${{ inputs.build_number }} \
            -p:CodesignKey="Apple Distribution" \
            -p:CodesignProvision="$(security cms -D -i $RUNNER_TEMP/ios.mobileprovision | plutil -extract Name raw -)" \
            -p:ValidateXcodeVersion=false -clp:ErrorsOnly -o artifacts/ios 2>&1 | tee ios-build.log \
            || { echo "::group::iOS build errors"; grep -E "error|Error" ios-build.log | sort -u | head -40; echo "::endgroup::"; exit 1; }

      - name: Build Mac App Store (.pkg)
        run: |
          if [ ! -f $RUNNER_TEMP/mac.provisionprofile ]; then echo "No Mac profile; skipping"; exit 0; fi
          set -o pipefail
          dotnet publish "$PROJECT" -f net9.0-maccatalyst -c Release \
            -p:CreatePackage=true -p:EnableCodeSigning=true -p:EnablePackageSigning=true \
            -p:ApplicationVersion=${{ inputs.build_number }} \
            -p:CodesignKey="Apple Distribution" \
            -p:PackageSigningKey="3rd Party Mac Developer Installer" \
            -p:CodesignProvision="$(security cms -D -i $RUNNER_TEMP/mac.provisionprofile | plutil -extract Name raw -)" \
            -p:UseHardenedRuntime=true \
            -p:ValidateXcodeVersion=false -clp:ErrorsOnly -o artifacts/mac 2>&1 | tee mac-build.log \
            || { echo "::group::Mac build errors"; grep -E "error|Error" mac-build.log | sort -u | head -40; echo "::endgroup::"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: apple-builds-${{ inputs.build_number }}
          path: |
            artifacts/ios/*.ipa
            artifacts/mac/*.pkg

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          for ipa in artifacts/ios/*.ipa; do
            xcrun altool --upload-app -t ios -f "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          done
          for pkg in artifacts/mac/*.pkg; do
            [ -f "$pkg" ] && xcrun altool --upload-app -t macos -f "$pkg" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          done

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/signing.keychain-db || true
