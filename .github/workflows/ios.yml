name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion (must increase every upload)"
        required: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        env:
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          echo "$PROFILE" | base64 --decode > profile.mobileprovision
          uuid=$(security cms -D -i profile.mobileprovision | plutil -extract UUID raw -)
          name=$(security cms -D -i profile.mobileprovision | plutil -extract Name raw -)
          cp profile.mobileprovision "$dir/$uuid.mobileprovision"
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"

      - name: Publish IPA
        run: >
          dotnet publish "Path of Boredom.Maui/Path of Boredom.Maui.csproj"
          -f net9.0-ios -c Release
          -p:ArchiveOnBuild=true
          -p:RuntimeIdentifier=ios-arm64
          -p:CodesignKey="Apple Distribution"
          -p:CodesignProvision="$PROFILE_NAME"
          -p:ApplicationVersion=${{ inputs.build_number }}
          -o artifacts

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8
          ipa=$(find artifacts -name "*.ipa" | head -n 1)
          xcrun altool --upload-app -t ios -f "$ipa" --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: artifacts/*.ipa
