<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover plus user-scalable=no: the game is a full-bleed canvas, so pinch-zoom
         and double-tap-to-zoom would fight the touch controls rather than help. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Path of Boredom</title>
    <base href="/" />
    <!-- The MAUI head's own scoped-CSS bundle, which @imports Path of Boredom.Game's bundle.
         Referencing the Game bundle directly would 404: only its fingerprinted name is packaged
         into the APK, and that hash changes whenever the game's component styles change. -->
    <link rel="stylesheet" href="PathOfBoredom.Maui.styles.css" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unexpected error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">Ã—</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
